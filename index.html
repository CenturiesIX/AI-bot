<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebLLM Chatbot</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="https://esm.run/@mlc-ai/web-llm"></script>
</head>
<body>
<div class="loading-screen" id="loading-screen">
<div class="spinner"></div>
<div class="loading-text">Loading model...</div>
</div>
<div class="chat-shell">
<div class="chat-container">
<header class="chat-header">
<div class="title">WebLLM Local Chat</div>
<div class="status" id="status">Model loading</div>
</header>
<div class="messages" id="messages"></div>
<div class="input-bar">
<textarea id="user-input" placeholder="Type your message..." rows="1"></textarea>
<button id="send-btn">Send</button>
</div>
</div>
</div>
<div class="thinking" id="thinking">Bot is thinking...</div>
<script type="module" src="script.js"></script>
</body>
</html>
